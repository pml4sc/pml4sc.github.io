- date: 2026-03-01
  title: IJCNN 2026 acceptance
  description: The accepted IJCNN 2026 paper presents COMPOL, a unified neural operator framework that models interactions among coupled physical processes with recurrent and attention-based feature aggregation for scalable multi-physics simulations.
  link: https://arxiv.org/abs/2501.17296
  tag: Paper Accepted
