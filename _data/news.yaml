  title: ICML 2026 acceptance
  description: The accepted ICML 2026 paper introduces RAMBO, a Bayesian optimization framework that uses Dirichlet process mixtures of Gaussian processes to adapt to heterogeneous objective regimes and improve uncertainty-aware search across scientific design tasks.
